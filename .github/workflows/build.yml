# Builds the browser extensions and the website from the same files
# (scripts/build.mjs), then:
#   every run         Chrome .zip and Firefox .xpi uploaded as build artifacts
#                     (as the files themselves, not zipped again)
#   push to main      the website deployed to GitHub Pages, with the two
#                     extension files under downloads/
#   tag v1.2.3        a GitHub Release with both files attached (and, if the
#                     AMO_JWT_ISSUER / AMO_JWT_SECRET secrets are set, a
#                     Firefox .xpi signed by Mozilla that installs permanently)
name: Build extensions and site

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pick the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            # e.g. 1.0.0.57: the base version plus the run number, so every build is newer than the last
            version="$(node -p "require('./scripts/manifest.base.json').version").${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Build
        run: node scripts/build.mjs
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Check the Firefox extension (web-ext lint)
        run: npx --yes web-ext@8 lint --source-dir dist/firefox --output text

      # archive: false uploads each file as it is, so the downloads are the
      # Chrome .zip itself and the Firefox .xpi itself (not wrapped in
      # another zip). The artifact is named after the file.
      - name: Upload Chrome extension (.zip)
        uses: actions/upload-artifact@v7
        with:
          path: dist/pomodoro-chrome-${{ steps.version.outputs.version }}.zip
          archive: false
          if-no-files-found: error

      - name: Upload Firefox extension (.xpi)
        uses: actions/upload-artifact@v7
        with:
          path: dist/pomodoro-firefox-${{ steps.version.outputs.version }}.xpi
          archive: false
          if-no-files-found: error

      - name: Upload website for Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

      - name: Keep the files for the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            dist/pomodoro-chrome-*.zip
            dist/pomodoro-firefox-*.xpi
            dist/firefox/

  deploy-pages:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sign the Firefox extension (only if the AMO secrets are set)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "No AMO secrets: the release gets the unsigned .xpi (loads as a temporary add-on)."
            exit 0
          fi
          npx --yes web-ext@8 sign --channel unlisted --source-dir dist/firefox \
            --artifacts-dir dist/signed --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
          signed="$(ls dist/signed/*.xpi | head -n 1)"
          mv "$signed" "dist/pomodoro-firefox-${{ needs.build.outputs.version }}-signed.xpi"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Pomodoro $GITHUB_REF_NAME" --generate-notes \
            dist/pomodoro-chrome-*.zip dist/pomodoro-firefox-*.xpi
